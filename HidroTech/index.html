<!DOCTYPE html>
<html lang="pr-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="lucas.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
</head>
<body class="ca_body">

    <header class="ca_header">
        <div class="ca_imgCadastro">
            <img src="https://lh3.googleusercontent.com/d/1e-tJL9cn5MiXpCIKL3_F_NTtaTGq627Q" alt="HidroTech">
        </div>
    </header>

    <main class="ca_main">
        <div class="ca_maindiv">
        <div class="ca_cadastro">
            <div class="ca_titulo">
                <i class="fa-solid fa-user"></i>

                <div>
                    <h1>Cadastro de Usuário</h1>
                    <p>Preencha os dados abaixo para criar sua conta.</p>
                    <hr>
                </div>
            </div>

            <form action="processa_login.php" method="POST" class="ca_form">
                <div class="ca_campo">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" name="nome" placeholder="Nome completo" required>
                </div>

                <div class="ca_campo">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" name="email" placeholder="E-mail" required>
                </div>

                <div class="ca_campo">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="senha" placeholder="Senha" required>
                </div>
                <button type="submit" class="ca_button">Confirmar</button>
            </form>
        </div>
        <div class="ca_imgGota">
            <img src="https://lh3.googleusercontent.com/d/19pVp20-TWw5Ib-swzsFVsXl6Cy6XWTmx" alt="">
        </div>
        </div>
        
    </main>

</body>
</html>
